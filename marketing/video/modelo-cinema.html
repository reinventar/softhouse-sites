<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!--
  Modelo "Cinema" do vídeo de entrega (Reels 9:16, 1080x1920).
  Mesmo contrato do modelo-entrega.html: lê window.CFG, expõe window.DURACAO e window.seek(t).
  Cenas: fotos em tela cheia que sobem uma sobre a outra (como a abertura dos sites "cinema"),
  o site rolando no celular e a chamada final. Cores e fonte vêm da config (cores.fundo, cores.texto, fonte_titulo).
  Config extra: "cenas": [{"foto","pos","kicker","titulo":"linha 1\nlinha 2","texto"}].
-->
<style id="fontes"></style>
<style>
:root{--fundo:#0D0C0B;--texto:#F4F4F2;--suave:rgba(244,244,242,.66);--titulo:"Inter Tight",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--fundo)}
body{font-family:var(--titulo);color:var(--texto)}
.cena{position:absolute;inset:0;overflow:hidden;visibility:hidden;background:var(--fundo)}
.cena img.f{position:absolute;left:0;top:-9%;width:100%;height:118%;object-fit:cover}
.sombra{position:absolute;inset:0;background:linear-gradient(to top,rgba(13,12,11,.92) 0,rgba(13,12,11,.55) 34%,rgba(13,12,11,.05) 62%),linear-gradient(to bottom,rgba(13,12,11,.55),transparent 18%)}
.escuro{position:absolute;inset:0;background:var(--fundo);opacity:0}
.copy{position:absolute;left:80px;right:80px;bottom:300px}
.kick{font-size:34px;font-weight:500;color:var(--suave);margin-bottom:28px}
.big{font-weight:800;font-size:150px;line-height:.9;letter-spacing:-.05em;text-transform:lowercase}
.big span{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.big i{display:block;font-style:normal}
.desc{margin-top:36px;font-size:40px;line-height:1.35;color:var(--suave);max-width:820px;font-weight:400}
.topo{position:absolute;top:70px;left:80px;right:80px;display:flex;align-items:center;justify-content:space-between;z-index:40;font-size:34px;font-weight:500}
.topo .logo{display:flex;align-items:center;gap:20px}
.topo .logo i{width:66px;height:66px;border:2.5px solid var(--texto);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:600}
.pager{position:absolute;left:80px;right:80px;bottom:150px;display:flex;align-items:center;gap:26px;font-size:30px;z-index:40;font-variant-numeric:tabular-nums}
.pager .bar{flex:1;height:3px;background:rgba(255,255,255,.25);position:relative}
.pager .bar b{position:absolute;left:0;top:0;bottom:0;background:var(--texto);width:0}
/* celular */
#site,#note{background:radial-gradient(900px 700px at 50% 62%,rgba(255,255,255,.12),transparent 70%),var(--fundo)}
.tt{position:absolute;left:80px;top:200px}
.tt .big{font-size:128px}
.cel{position:absolute;left:50%;top:640px;width:640px;height:1060px;margin-left:-320px;border-radius:64px;background:#000;padding:18px;box-shadow:0 0 0 2px rgba(255,255,255,.18),0 60px 120px rgba(0,0,0,.6)}
.tela{position:relative;width:604px;height:1024px;border-radius:48px;overflow:hidden;background:#111}
.tela img{position:absolute;left:0;top:0;width:604px}
.lap{position:absolute;left:50%;top:720px;width:980px;margin-left:-490px;padding:30px 30px 36px;border-radius:34px 34px 0 0;background:#000;box-shadow:0 0 0 2px rgba(255,255,255,.18),0 60px 120px rgba(0,0,0,.6)}
.lscr{position:relative;width:920px;height:575px;overflow:hidden;border-radius:6px;background:#111}
.lscr img{position:absolute;left:0;top:0;width:920px}
.lbase{position:absolute;left:50%;top:1361px;width:1050px;margin-left:-525px;height:36px;border-radius:0 0 44px 44px;background:linear-gradient(#3a3a3a,#121212);box-shadow:0 30px 60px rgba(0,0,0,.6)}
#note .rot{top:1520px}
.rot{position:absolute;left:50%;top:1740px;transform:translateX(-50%);padding:18px 36px;border-radius:99px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.22);font-size:34px;font-weight:500;white-space:nowrap}
/* chamada */
#cta .fundo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(30px) brightness(.28) saturate(1.1);transform:scale(1.15)}
#cta .bloco{position:absolute;left:80px;right:80px;top:560px}
#cta .big{font-size:140px}
#cta .sub{margin-top:90px;font-size:40px;color:var(--suave)}
#cta .url{display:inline-block;margin-top:24px;padding:26px 40px;border-radius:99px;background:var(--texto);color:var(--fundo);font-size:52px;font-weight:700;letter-spacing:-.02em}
#cta .bio{display:inline-block;margin-top:26px;padding:16px 30px;border-radius:99px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.22);font-size:32px;font-weight:500}
#cta .wa{margin-top:60px;font-size:40px;line-height:1.35;color:var(--suave);max-width:860px}
.cred{position:absolute;left:80px;bottom:80px;font-size:26px;color:rgba(255,255,255,.45);z-index:60}
.cena img.fundo-card{filter:blur(34px) brightness(.35);transform:scale(1.2)}
.cena img.card{position:absolute;left:60px;width:960px;top:300px;border-radius:28px;box-shadow:0 50px 120px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.12)}
#ass{background:#0B0A0C}
#ass .brilho{position:absolute;width:900px;height:900px;left:50%;top:50%;margin:-450px 0 0 -450px;border-radius:50%;background:radial-gradient(closest-side,rgba(217,79,138,.32),rgba(34,197,139,.08) 60%,transparent)}
#ass .bloco{position:absolute;left:0;right:0;top:640px;display:flex;flex-direction:column;align-items:center;gap:34px;font-family:"Geist",var(--titulo);color:#FAF8F9}
#ass .por{font:500 40px "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#22C58B}
#ass .marca{display:flex;align-items:center;gap:30px}
#ass .word{font-size:120px;letter-spacing:-.045em;line-height:1;font-weight:400}
#ass .word .e{display:inline-block;transform:scaleX(-1);color:#D94F8A}
#ass .word sup{font:400 40px "Geist Mono",monospace;color:#22C58B;margin-left:8px;vertical-align:top;position:relative;top:10px}
#ass .frase{font:400 42px "Geist",var(--titulo);color:#CFC7CB;text-align:center;max-width:820px;line-height:1.35}
</style></head><body>
<div id="palco"></div>
<script>
const C = window.CFG || {};
const r = document.documentElement.style;
if (C.cores) { r.setProperty("--fundo", C.cores.fundo); r.setProperty("--texto", C.cores.texto || "#F4F4F2"); }
if (C.fonte_titulo) r.setProperty("--titulo", `"${C.fonte_titulo}",system-ui,sans-serif`);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linhas = t => String(t).split("\n").map(l => `<span><i>${esc(l)}</i></span>`).join("");
const CENAS = [{foto: C.foto_principal, pos: C.pos_principal || "50% 25%", kicker: C.kicker_principal || "", titulo: C.intro || C.nome, texto: C.texto_principal || ""}, ...(C.cenas || [])];
const PAR = C.paradas || [];
const ASS = C.assinatura_reinventar === true;
const NOTE = !!C.print_notebook, PARN = C.paradas_notebook || [];
const N = CENAS.length, DUR = 3.0, TR = 0.9, P = N * DUR;
const PDN = NOTE ? 1.6 + 1.12 * Math.max(PARN.length, 1) : 0, SITE0 = P + PDN, PD = 1.6 + 1.12 * Math.max(PAR.length, 1);
const CTA = SITE0 + PD, ASI = CTA + 4.6, FIM = ASI + (ASS ? 3.4 : 0);
const ST = [...CENAS.map((c, i) => i * DUR), ...(NOTE ? [P] : []), SITE0, CTA, ...(ASS ? [ASI] : [])];
window.DURACAO = FIM;
const palco = document.getElementById("palco");
palco.innerHTML = CENAS.map((c, i) => `<section class="cena" style="z-index:${i + 1}"><img class="f${c.card ? " fundo-card" : ""}" src="${esc(c.foto)}" style="object-position:${esc(c.pos || "50% 30%")}">${c.card ? `<img class="card" src="${esc(c.foto)}">` : ""}<div class="sombra"></div><div class="escuro"></div>
 <div class="copy">${c.kicker ? `<p class="kick">${esc(c.kicker)}</p>` : ""}<h1 class="big">${linhas(c.titulo)}</h1>${c.texto ? `<p class="desc">${esc(c.texto)}</p>` : ""}</div></section>`).join("")

 + (NOTE ? `<section class="cena" id="note" style="z-index:${N + 1}"><div class="tt"><p class="kick">${esc(C.kicker_notebook || "No computador")}</p><h1 class="big">${linhas(C.titulo_notebook || "no\nnotebook")}</h1></div>
   <div class="lap"><div class="lscr"><img id="printN" src="${esc(C.print_notebook)}"></div></div><div class="lbase"></div><div class="rot" id="rotN"></div></section>` : "")
 + `<section class="cena" id="site" style="z-index:${N + 2}"><div class="tt"><p class="kick">${esc(C.kicker_site || "Feito para o celular")}</p><h1 class="big">${linhas(C.titulo_site || "tá tudo no\nmeu site")}</h1></div>
   <div class="cel"><div class="tela"><img id="print" src="${esc(C.print_site || "")}"></div></div><div class="rot" id="rot"></div></section>`
 + `<section class="cena" id="cta" style="z-index:${N + 3}"><img class="fundo" src="${esc(C.foto_principal)}"><div class="bloco"><h1 class="big">${linhas(C.cta || "meu site novo\nestá no ar.")}</h1>
   <p class="sub">${esc(C.cta_sub || "Confere lá:")}</p><div class="url">${esc(C.url || "")}</div><br>${C.cta_chip === "" ? "" : `<span class="bio">${esc(C.cta_chip || "Link na bio")}</span>`}<p class="wa">${esc(C.cta_whatsapp || "")}</p></div></section>`

 + (ASS ? `<section class="cena" id="ass" style="z-index:${N + 4}"><div class="brilho"></div><div class="bloco"><div class="por">Site criado por</div><div class="marca"><svg viewBox="0 0 100 100" fill="none" style="width:150px;height:150px"><path d="M14 38V14H38M62 86H86V62" stroke="#22C58B" stroke-opacity=".8" stroke-width="6"/><path d="M24 46V24H46M54 76H76V54" stroke="#D94F8A" stroke-width="6"/><rect x="40" y="40" width="20" height="20" rx="4" fill="#F4C9DA"/></svg><span class="word">r<span class="e">e</span>inventar<sup>.dev</sup></span></div><div class="frase">${esc(C.assinatura_frase || "Sites que trabalham por você.")}</div></div></section>` : "")
 + `<div class="topo"><span class="logo"><i>${esc(C.monograma || "")}</i>${esc(C.nome || "")}</span><span>${esc(C.registro || "")}</span></div>`
 + `<div class="pager" id="pager"><span id="pn">01</span><span class="bar"><b id="pb"></b></span><span>${String(N).padStart(2, "0")}</span></div>`
 + `<div class="cred">site por reinventar.dev</div>`;
const secs = [...document.querySelectorAll(".cena")];
const el = secs.map(s => ({ s, img: s.querySelector("img"), esc: s.querySelector(".escuro"), copy: s.querySelector(".copy,.tt,.bloco"), ls: [...s.querySelectorAll(".big i")], fades: [...s.querySelectorAll(".kick,.desc,.sub,.url,.bio,.wa,.cel,.lap,.lbase,.rot,.por,.marca,.frase,.card")] }));
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), ease = x => 1 - Math.pow(1 - cl(x), 3), io = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const inicio = i => ST[i];
function quadro(t) {
  const tp = document.querySelector(".topo"), cr = document.querySelector(".cred"); const fa = ASS ? 1 - cl((t - ASI) / .6) : 1; tp.style.opacity = fa; cr.style.opacity = fa;
  el.forEach((e, i) => {
    const s0 = inicio(i), s1 = i + 1 < el.length ? inicio(i + 1) : 1e9;
    if (t < s0 || t > s1 + TR) { e.s.style.visibility = "hidden"; return; }
    e.s.style.visibility = "visible";
    const a = t - s0;
    // entrada: sobe de baixo (a primeira cena nasce do escuro)
    if (i === 0) { e.s.style.clipPath = "none"; if (e.esc) e.esc.style.opacity = 1 - ease(a / .8); }
    else { const q = 1 - io(a / TR); e.s.style.clipPath = `inset(${q * 100}% 0 0 0)`; }
    const kb = 1.07 - .05 * cl(a / (s1 - s0 + TR));
    let sy = i === 0 ? 0 : (1 - io(a / TR)) * 18;
    // saída: a próxima cobre, esta sobe e escurece
    const b = t - s1, qo = b > 0 ? io(b / TR) : 0;
    if (e.img && !e.s.id && !e.img.classList.contains('fundo-card')) e.img.style.transform = `translateY(${sy - qo * 14}%) scale(${kb + qo * .06})`;
    if (e.esc && (i > 0 || a > .8)) e.esc.style.opacity = qo * .75;
    if (e.copy) { e.copy.style.transform = `translateY(${-qo * 160}px)`; e.copy.style.opacity = 1 - qo * 1.3; }
    e.ls.forEach((l, j) => { const k = ease((a - .25 - j * .12) / .75); l.style.transform = `translateY(${(1 - k) * 110}%)`; });
    e.fades.forEach((f, j) => { const k = ease((a - .55 - j * .1) / .7); f.style.opacity = k; f.style.transform = `translateY(${(1 - k) * 30}px)`; });
  });
  // pager
  const pg = document.getElementById("pager"), pc = cl(t / P);
  pg.style.opacity = 1 - cl((t - (P - .3)) / .5);
  document.getElementById("pn").textContent = String(Math.min(N, Math.floor(t / DUR) + 1)).padStart(2, "0");
  document.getElementById("pb").style.width = (pc * 100) + "%";
  rolar("print", "rot", PAR, SITE0, PD);
  if (NOTE) rolar("printN", "rotN", PARN, P, PDN);
}
function rolar(img, rot, par, ini, dur) {
  if (!par.length) return;
  const a = cur - ini - 1.0, seg = (dur - 1.6) / par.length; let y = par[0].y, k = 0;
  if (a > 0) { k = Math.min(par.length - 1, Math.floor(a / seg)); const f = io(((a - k * seg) - (seg - .55)) / .55);
    const y0 = par[k].y, y1 = par[Math.min(k + 1, par.length - 1)].y; y = y0 + (y1 - y0) * (k < par.length - 1 ? f : 0); if (f > .5 && k < par.length - 1) k++; }
  document.getElementById(img).style.transform = `translateY(${-y}px)`;
  document.getElementById(rot).textContent = par[k].rotulo || "";
}
let cur = 0;
window.seek = t => { cur = t; quadro(t); }; window.seek(0);
</script></body></html>
