name: Imagens

# miniaturas: baixa miniaturas de cada id de sites/_imagens/candidatos.json para
#             sites/_imagens/candidatos/<site>/<item>/<n>-<id>.jpg (pasta com "_" não é publicada).
# baixar:     lê sites/_imagens/escolhas.json ({"site": {"nome": "<id>"}}) e grava
#             sites/<site>/img/<nome>.webp (até 1800px) + CREDITOS.txt.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "miniaturas ou baixar"
        required: true
        default: miniaturas

permissions:
  contents: write

jobs:
  imagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas
        run: sudo apt-get install -y -qq webp >/dev/null
      - name: Executar
        env:
          MODO: ${{ github.event.inputs.modo }}
        run: |
          set -u
          cdn="https://images.unsplash.com"
          if [ "$MODO" = "miniaturas" ]; then
            C=sites/_imagens/candidatos.json
            rm -rf sites/_imagens/candidatos
            for site in $(jq -r 'keys[]' $C); do
              for item in $(jq -r --arg s "$site" '.[$s] | keys[]' $C); do
                d=sites/_imagens/candidatos/$site/$item; mkdir -p $d; n=0; ok=0
                for id in $(jq -r --arg s "$site" --arg i "$item" '.[$s][$i][]' $C); do
                  n=$((n+1))
                  code=$(curl -sS -L -o "$d/$n-$id.jpg" -w '%{http_code}' "$cdn/$id?w=360&q=60&fm=jpg")
                  if [ "$code" = "200" ]; then ok=$((ok+1)); else rm -f "$d/$n-$id.jpg"; echo "::warning title=$site/$item::$id HTTP $code"; fi
                done
                echo "::notice title=$site/$item::$ok de $n baixadas"
              done
            done
            git add -A sites/_imagens/candidatos
          else
            E=sites/_imagens/escolhas.json
            for site in $(jq -r 'keys[]' $E); do
              mkdir -p sites/$site/img; cred=sites/$site/img/CREDITOS.txt
              echo "Fotos do Unsplash (licença Unsplash: uso comercial gratuito)" > $cred
              for nome in $(jq -r --arg s "$site" '.[$s] | keys[]' $E); do
                id=$(jq -r --arg s "$site" --arg n "$nome" '.[$s][$n]' $E)
                code=$(curl -sS -L -o /tmp/a.jpg -w '%{http_code}' "$cdn/$id?w=1800&q=85&fm=jpg&fit=max")
                [ "$code" = "200" ] || { echo "::error title=$site/$nome::$id HTTP $code"; continue; }
                cwebp -quiet -q 76 /tmp/a.jpg -o sites/$site/img/$nome.webp
                echo "$nome: $cdn/$id" >> $cred
                echo "::notice title=$site/$nome::$(du -k sites/$site/img/$nome.webp | cut -f1) KB"
              done
              git add sites/$site/img
            done
          fi
          git -c user.name="Reinventar Bot" -c user.email="noreply@reinventar.dev" commit -qm "Imagens ($MODO)" || echo "nada novo"
          git push
