name: Imagens

# buscar: procura fotos gratuitas no Unsplash para cada item de sites/_imagens/manifesto.json
#         e grava miniaturas em sites/_imagens/candidatos/<site>/<item>/ (não é publicado).
# baixar: lê sites/_imagens/escolhas.json ({"site": {"item": "<id da foto>"}}) e grava
#         sites/<site>/img/<item>.webp (1800px) + CREDITOS.txt.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "buscar ou baixar"
        required: true
        default: buscar

permissions:
  contents: write

jobs:
  imagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas
        run: sudo apt-get install -y -qq webp >/dev/null
      - name: Executar
        env:
          MODO: ${{ github.event.inputs.modo }}
        run: |
          set -u
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          M=sites/_imagens/manifesto.json
          if [ "$MODO" = "buscar" ]; then
            rm -rf sites/_imagens/candidatos; mkdir -p sites/_imagens/candidatos
            for site in $(jq -r 'keys[]' $M); do
              for item in $(jq -r --arg s "$site" '.[$s] | keys[]' $M); do
                q=$(jq -r --arg s "$site" --arg i "$item" '.[$s][$i].busca' $M)
                o=$(jq -r --arg s "$site" --arg i "$item" '.[$s][$i].orientacao' $M)
                d=sites/_imagens/candidatos/$site/$item; mkdir -p $d
                slugq=$(echo "$q" | tr ' ' '-')
                html=$(curl -sS -A "$UA" -H "Accept-Language: en-US" "https://unsplash.com/s/photos/$slugq?orientation=$o")
                echo "::notice title=debug $site/$item::html $(echo "$html" | wc -c) bytes, photo refs $(echo "$html" | grep -oE 'photo-[0-9]{10,}-[0-9a-f]{6,}' | sort -u | wc -l), plus refs $(echo "$html" | grep -o 'plus.unsplash' | wc -l)"
                ids=$(echo "$html" | grep -oE 'https://images\.unsplash\.com/photo-[0-9]+-[0-9a-f]+' | sed 's#https://images.unsplash.com/##' | awk '!seen[$0]++' | head -8)
                if [ -z "$ids" ]; then echo "::error title=$site/$item::sem resultados (HTTP bloqueado?) $(echo "$html" | head -c 150 | tr '\n' ' ')"; continue; fi
                echo "[]" > $d/ids.json; n=0
                for id in $ids; do
                  n=$((n+1)); curl -sS -A "$UA" -L "https://images.unsplash.com/$id?w=420&q=60&fm=jpg" -o "$d/$n-$id.jpg"
                  jq --arg id "$id" '. + [{id: $id, raw: ("https://images.unsplash.com/" + $id + "?ixlib=rb-4.0.3"), autor: "Unsplash", perfil: ("https://images.unsplash.com/" + $id)}]' $d/ids.json > /tmp/i && mv /tmp/i $d/ids.json
                done
                echo "::notice title=$site/$item::$n candidatos"
              done
            done
            git add sites/_imagens/candidatos
          else
            E=sites/_imagens/escolhas.json
            for site in $(jq -r 'keys[]' $E); do
              mkdir -p sites/$site/img; cred=sites/$site/img/CREDITOS.txt
              echo "Fotos do Unsplash (licença Unsplash: uso comercial gratuito)" > $cred
              for item in $(jq -r --arg s "$site" '.[$s] | keys[]' $E); do
                id=$(jq -r --arg s "$site" --arg i "$item" '.[$s][$i]' $E)
                info=$(jq -c --arg id "$id" '.[] | select(.id == $id)' sites/_imagens/candidatos/$site/*/ids.json | head -1)
                [ -n "$info" ] || { echo "::error title=$site/$item::id $id não está nos candidatos"; continue; }
                raw=$(echo "$info" | jq -r .raw)
                curl -sS -A "$UA" -L "${raw}&w=1800&q=82&fm=jpg&fit=max" -o /tmp/a.jpg
                cwebp -quiet -q 78 -resize 1800 0 /tmp/a.jpg -o sites/$site/img/$item.webp || cwebp -quiet -q 78 /tmp/a.jpg -o sites/$site/img/$item.webp
                echo "$item: https://images.unsplash.com/$id" >> $cred
                echo "::notice title=$site/$item::$(du -k sites/$site/img/$item.webp | cut -f1) KB"
              done
              git add sites/$site/img
            done
          fi
          git -c user.name="Reinventar Bot" -c user.email="noreply@reinventar.dev" commit -qm "Imagens ($MODO)" || echo "nada novo"
          git push
