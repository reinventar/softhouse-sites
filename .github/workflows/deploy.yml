name: Publicar sites

on:
  push:
    branches: [main]
    paths: ["sites/**"]
  workflow_dispatch:
    inputs:
      slug:
        description: "Pasta do cliente em sites/ (vazio = todos)"
        required: false
        default: ""

concurrency:
  group: publicar-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Descobrir clientes alterados
        id: changed
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            echo "slugs=${{ github.event.inputs.slug }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slugs=$(ls sites | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          else
            slugs=$(git diff --name-only HEAD~1 HEAD -- sites/ | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar na Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          SOFTHOUSE_DOMAIN: ${{ vars.SOFTHOUSE_DOMAIN }}
        run: |
          for slug in ${{ steps.changed.outputs.slugs }}; do
            case "$slug" in _*) continue ;; esac
            if [ -d "sites/$slug" ]; then bash scripts/deploy.sh "$slug"; fi
          done
