name: Limites Cloudflare

# Confere os limites do plano gratuito da Cloudflare Pages e abre um alerta (issue) quando estiver chegando perto.
# Roda toda segunda-feira e depois de cada publicação.
on:
  schedule:
    - cron: "17 11 * * 1"   # segunda, 08:17 em Brasília
  workflow_run:
    workflows: ["Publicar sites"]
    types: [completed]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - name: Contar projetos e publicações do mês
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Limites do plano gratuito (developers.cloudflare.com/pages/platform/limits)
          LIM_PROJETOS: 100
          LIM_PUBLICACOES: 500
          # Quando avisar
          AVISO_PROJETOS: 70
          MIGRAR_PROJETOS: 80
          AVISO_PUBLICACOES: 350
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          # todos os projetos Pages da conta
          projetos=""; page=1
          while :; do
            r=$(curl -sS -H "$H" "$api?per_page=10&page=$page")
            echo "$r" | jq -e '.success' >/dev/null || { echo "::error::API: $(echo "$r" | jq -c '.errors')"; exit 1; }
            nomes=$(echo "$r" | jq -r '.result[].name')
            [ -z "$nomes" ] && break
            projetos="$projetos $nomes"; page=$((page+1))
          done
          n_proj=$(echo $projetos | wc -w)

          # publicações deste mês (UTC) somando todos os projetos
          inicio=$(date -u +%Y-%m-01)
          n_pub=0
          for p in $projetos; do
            page=1
            while :; do
              r=$(curl -sS -H "$H" "$api/$p/deployments?per_page=25&page=$page")
              total=$(echo "$r" | jq '[.result[]?] | length')
              mes=$(echo "$r" | jq --arg d "$inicio" '[.result[]? | select(.created_on >= $d)] | length')
              n_pub=$((n_pub+mes))
              [ "$total" -lt 25 ] || [ "$mes" -lt "$total" ] && break
              page=$((page+1))
            done
          done

          clientes=$(echo $projetos | tr ' ' '\n' | grep -c '^sh-' || true)
          {
            echo "### Limites da Cloudflare Pages"
            echo "| Item | Uso | Limite |"
            echo "|---|---|---|"
            echo "| Projetos (sites) | $n_proj ($clientes de clientes) | $LIM_PROJETOS |"
            echo "| Publicações em $(date -u +%m/%Y) | $n_pub | $LIM_PUBLICACOES |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=limites::Projetos $n_proj/$LIM_PROJETOS · publicações do mês $n_pub/$LIM_PUBLICACOES"

          alerta () {  # alerta TITULO TEXTO — abre issue uma vez (não repete se já houver uma aberta)
            if gh issue list --state open --search "\"$1\" in:title" --json number --jq 'length' | grep -qv '^0$'; then
              echo "alerta já aberto: $1"; return
            fi
            gh issue create --title "$1" --body "$2" --assignee reinventar || gh issue create --title "$1" --body "$2"
            echo "::warning title=limites::$1"
          }

          if [ "$n_proj" -ge "$MIGRAR_PROJETOS" ]; then
            alerta "🔴 Cloudflare: $n_proj de $LIM_PROJETOS sites — hora de migrar (Fase 2)" \
              "$(printf 'A conta tem **%s projetos** na Cloudflare Pages (%s de clientes). O limite do plano gratuito é %s e não costuma ser aumentado.\n\n**O que fazer:** abrir o chat geral da Reinventar e pedir: *"vamos migrar para a plataforma única (Cloudflare for SaaS)"*. Até migrar, novos clientes ainda cabem, mas a margem é pequena.' "$n_proj" "$clientes" "$LIM_PROJETOS")"
          elif [ "$n_proj" -ge "$AVISO_PROJETOS" ]; then
            alerta "🟡 Cloudflare: $n_proj de $LIM_PROJETOS sites — planejar a Fase 2" \
              "$(printf 'A conta tem **%s projetos** na Cloudflare Pages (%s de clientes). Com %s é hora de migrar para a plataforma única (Cloudflare for SaaS); o limite é %s.\n\n**O que fazer agora:** nada urgente. Peça no chat geral da Reinventar para planejar a Fase 2 nas próximas semanas.' "$n_proj" "$clientes" "$MIGRAR_PROJETOS" "$LIM_PROJETOS")"
          fi

          if [ "$n_pub" -ge "$AVISO_PUBLICACOES" ]; then
            alerta "🟡 Cloudflare: $n_pub de $LIM_PUBLICACOES publicações em $(date -u +%m/%Y)" \
              "$(printf 'Este mês já foram **%s publicações**. O plano gratuito permite %s por mês; o contador zera no dia 1.\n\n**O que fazer:** juntar ajustes de um mesmo cliente num único envio até o fim do mês. Se acontecer de novo no mês seguinte, avaliar o plano pago (Pages Pro) ou a Fase 2.' "$n_pub" "$LIM_PUBLICACOES")"
          fi
